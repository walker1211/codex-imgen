server:
  listen: 127.0.0.1:18080
  read_timeout: 5s
  write_timeout: 30s

storage:
  data_dir: ""
  sqlite_path: ""

scheduler:
  global_max_concurrency: 10 # serve 内底层生图队列的总并发上限；submit async 和 WebSocket realtime 共用
  max_count_per_job: 10 # submit async 单个 job 最多生成多少张图
  maintenance_interval: 5m # 后台维护任务执行间隔
  task_lease_timeout: 30m # 后台任务租约超时时间
  max_attempts: 3 # submit async 单张图片失败后的最大重试次数

backend:
  type: built_in_codex
  command: codex
  model: gpt-5.4
  cwd: ""
  timeout: 90s
  prompt:
    prefix: "$imagegen"
    prelude: |
      使用内置 imagegen 技能。
      输出单张图片。
      默认适合网页或品牌资产场景。

realtime:
  enabled: true # 是否启用 WebSocket realtime 生图接口
  max_sessions: 4 # 同时最多允许多少个活跃 WebSocket 生图 session
  max_items_per_session: 8 # 单个 WebSocket generate.start 最多包含多少个 item
  max_count_per_item: 1 # 单个 realtime item 最多生成多少张图
  item_timeout: 300s # 单个 realtime item 生成超时时间

email:
  enabled: false
  smtp_host: smtp.example.com
  smtp_port: 465
  from: from@example.com
  to: to@example.com
  timeout: 3s
  retry_times: 3
  retry_wait_time: 500ms
  use_proxy: false
