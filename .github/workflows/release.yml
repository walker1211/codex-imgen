name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Local CI
        run: scripts/ci-local.sh clean

  build:
    runs-on: ubuntu-latest
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            ext: ""
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            ext: ""
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            ext: ""
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: ".exe"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SUFFIX: ${{ matrix.suffix }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          package="codex-imgen-${SUFFIX}"
          mkdir -p "dist/${package}/configs"
          GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/${package}/imgen${EXT}" ./cmd/imgen
          GOOS="${GOOS}" GOARCH="${GOARCH}" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "dist/${package}/skill-sync${EXT}" ./cmd/skill-sync
          cp configs/config.example.yaml "dist/${package}/configs/config.example.yaml"
          cp .example.env README.md README.en.md README.zh-CN.md LICENSE "dist/${package}/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: codex-imgen-${{ matrix.suffix }}
          path: dist/codex-imgen-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum codex-imgen-*.tar.gz > checksums.txt)

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_file" ]]; then
            printf 'release notes file missing: %s\n' "$notes_file" >&2
            exit 1
          fi

          if gh release view "${TAG_NAME}" --repo "${GH_REPO}" >/dev/null 2>&1; then
            gh release edit "${TAG_NAME}" --repo "${GH_REPO}" --title "${TAG_NAME}" --notes-file "$notes_file"
            gh release view "${TAG_NAME}" --repo "${GH_REPO}" --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              case "$asset" in
                codex-imgen-darwin-amd64.tar.gz|codex-imgen-darwin-arm64.tar.gz|codex-imgen-linux-amd64.tar.gz|codex-imgen-linux-arm64.tar.gz|codex-imgen-windows-amd64.tar.gz|codex-imgen-windows-arm64.tar.gz|codex-imgen_${TAG_NAME}_darwin_amd64.tar.gz|codex-imgen_${TAG_NAME}_darwin_arm64.tar.gz|codex-imgen_${TAG_NAME}_linux_amd64.tar.gz|codex-imgen_${TAG_NAME}_linux_arm64.tar.gz|codex-imgen_${TAG_NAME}_windows_amd64.tar.gz|codex-imgen_${TAG_NAME}_windows_arm64.tar.gz|checksums.txt|sha256sums.txt)
                  gh release delete-asset "${TAG_NAME}" "$asset" --repo "${GH_REPO}" --yes
                  ;;
              esac
            done
            gh release upload "${TAG_NAME}" dist/* --repo "${GH_REPO}" --clobber
          else
            gh release create "${TAG_NAME}" dist/* --repo "${GH_REPO}" --verify-tag --title "${TAG_NAME}" --notes-file "$notes_file"
          fi
