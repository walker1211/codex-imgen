name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact_name: codex-imgen_${{ github.ref_name }}_linux_amd64
          - goos: linux
            goarch: arm64
            artifact_name: codex-imgen_${{ github.ref_name }}_linux_arm64
          - goos: darwin
            goarch: amd64
            artifact_name: codex-imgen_${{ github.ref_name }}_darwin_amd64
          - goos: darwin
            goarch: arm64
            artifact_name: codex-imgen_${{ github.ref_name }}_darwin_arm64
          - goos: windows
            goarch: amd64
            artifact_name: codex-imgen_${{ github.ref_name }}_windows_amd64
          - goos: windows
            goarch: arm64
            artifact_name: codex-imgen_${{ github.ref_name }}_windows_arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Build release archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
        shell: bash
        run: |
          set -euo pipefail

          artifact_dir=".dist/${ARTIFACT_NAME}"
          ext=""
          if [ "$GOOS" = "windows" ]; then
            ext=".exe"
          fi

          mkdir -p "$artifact_dir"
          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$artifact_dir/imgen$ext" ./cmd/imgen
          GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o "$artifact_dir/skill-sync$ext" ./cmd/skill-sync
          tar -czf ".dist/${ARTIFACT_NAME}.tar.gz" -C "$artifact_dir" "imgen$ext" "skill-sync$ext"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: .dist/${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          path: .dist/release

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          find .dist/release -mindepth 2 -type f -name '*.tar.gz' -exec mv {} .dist/release/ \;
          find .dist/release -mindepth 1 -type d -empty -delete
          cd .dist/release
          sha256sum codex-imgen_*.tar.gz > sha256sums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .dist/release/* --repo "$GH_REPO" --clobber
          else
            gh release create "$GITHUB_REF_NAME" .dist/release/* --repo "$GH_REPO" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
